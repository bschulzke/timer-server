services:
  timer:
    # Auto-deploy sets TIMER_IMAGE to the exact image GitHub built from main. A manual
    # `docker compose up -d --build` still builds locally, as before.
    image: ${TIMER_IMAGE:-timer-server-timer}
    build: .
    restart: unless-stopped
    environment:
      MAX_AGE_HOURS: 72        # idle games are deleted after this long
    volumes:
      - timer-data:/data
    expose:
      - "3000"
    # Locked down like the previews: read-only except saved games, no extra privileges.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/previews/allowed:/previews/allowed:ro   # active PR previews (see deploy/preview.sh)
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - default
      - previews     # so Caddy can reach PR preview containers, which can't reach the live site
    depends_on:
      - timer
networks:
  previews:
    name: timer-previews
volumes:
  timer-data:
  caddy-data:
  caddy-config:
