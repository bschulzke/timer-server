# Deploys each PR to https://<number>.preview.tinytabletops.com and removes it when the PR closes.
# Needs two repository secrets: PREVIEW_HOST (the droplet's IP) and PREVIEW_SSH_KEY (the private
# key whose public half is locked to deploy/preview.sh on the droplet). PREVIEW_KNOWN_HOSTS is
# optional; without it the droplet's host key is trusted on first contact.
name: PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event.action != 'closed' }}

permissions:
  pull-requests: write

jobs:
  preview:
    # Branches in this repo only. GitHub gives no secrets to PRs from forks anyway.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Deploy or remove the preview
        id: ssh
        env:
          KEY: ${{ secrets.PREVIEW_SSH_KEY }}
          HOST: ${{ secrets.PREVIEW_HOST }}
          KNOWN: ${{ secrets.PREVIEW_KNOWN_HOSTS }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          ACTION: ${{ github.event.action }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/preview && chmod 600 ~/.ssh/preview
          if [ -n "$KNOWN" ]; then printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          else ssh-keyscan -t ed25519 "$HOST" > ~/.ssh/known_hosts 2>/dev/null; fi
          if [ "$ACTION" = closed ]; then CMD="remove $PR"; else CMD="deploy $PR $SHA"; fi
          set +e
          ssh -i ~/.ssh/preview -o BatchMode=yes deploy@"$HOST" "$CMD" > out.txt 2>&1
          code=$?
          set -e
          cat out.txt
          { echo 'result<<EOF'; tail -n 5 out.txt; echo 'EOF'; } >> "$GITHUB_OUTPUT"
          exit $code

      - name: Comment on the PR
        if: always()
        uses: actions/github-script@v7
        env:
          RESULT: ${{ steps.ssh.outputs.result }}
          OUTCOME: ${{ steps.ssh.outcome }}
        with:
          script: |
            const pr = context.payload.pull_request;
            const marker = '<!-- pr-preview -->';
            const short = pr.head.sha.slice(0, 7);
            const out = (process.env.RESULT || '').trim();
            let body;
            if (context.payload.action === 'closed') {
              body = `${marker}\n**Preview removed** (PR closed).`;
            } else if (process.env.OUTCOME === 'success') {
              const url = out.split('\n').filter(l => l.startsWith('https://')).pop();
              body = `${marker}\n**Preview:** ${url}\n\nBuilt from ${short}. Updated on every push, removed when this PR closes. Preview games aren't saved and never touch the live site.`;
            } else {
              body = `${marker}\n**Preview failed** for ${short}:\n\n\`\`\`\n${out || 'no output'}\n\`\`\``;
            }
            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr.number });
            const mine = comments.find(c => c.body && c.body.startsWith(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
